<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>事件详情 · 投递台</title>
  <link rel="stylesheet" href="/styles.css"/>
  <script src="/common.js"></script>
</head>
<body>
<header class="顶栏">
    <div class="牌">投递台</div>
    <nav>
      <a href="/">投递台</a>
      <a href="/端点名册.html">端点名册</a>
      <a href="/事件队列.html">事件队列</a>
      <a href="/投递流水.html">投递流水</a>
      <a href="/死信匣.html">死信匣</a>
      <a href="/签名规.html">签名规</a>
      <a href="/投递互证.html">投递互证</a>
      <a href="/事件详情.html" class="亮">事件详情</a>
    </nav>
    <button class="按钮 次" type="button" onclick="fetch('/api/登出',{method:'POST'}).then(()=>location.href='/login')">退出</button>
  </header>
  <main class="主区">
    <header class="页头">
      <h1>事件详情</h1>
      <p>Webhook 投递控制台 · 应用开发全栈 · 非工单客服</p>
    </header>

<section class="卷" data-时钟容忍上限="40">
  <h2>本次用的是哪一档上限</h2>
  <p class="说明">骨签：对端时钟快 <b>40 秒（含）以内</b> → <span class="徽章 通过">容忍内通过</span>；快过 40 秒 → <span class="徽章 拒绝">超出容忍已拒</span>。每张票行内冻结秒差、上限档与快照号；旧票读快照，不随签名规改秒而回刷。</p>
</section>

<section class="卷">
  <label>事件号</label><input id="事件号"/>
  <button class="按钮" type="button" id="查">查询</button>
  <p class="消息" id="档情"></p>
  <h2>验签裁决（现行轨）</h2>
  <div class="表绕"><table><thead><tr><th>裁决号</th><th>会话名</th><th>秒差</th><th>方向</th><th>容忍上限秒</th><th>上限档</th><th>判定</th><th>验签状态</th><th>快照号</th><th>时刻</th></tr></thead><tbody id="裁表"></tbody></table></div>
  <h2>投递尝试</h2>
  <div class="表绕"><table><thead><tr><th>尝试号</th><th>状态</th><th>秒差</th><th>上限档</th><th>判定</th><th>拒因</th><th>投递时</th></tr></thead><tbody id="试表"></tbody></table></div>
  <h2>完整账</h2>
  <pre id="出" class="说明"></pre>
</section>

  </main>

<script>
function 钟徽章(文) {
  const s = document.createElement('span');
  s.className = '徽章 ' + (文 === '容忍内通过' ? '成功' : (文 === '超出容忍已拒' ? '失败' : ''));
  s.textContent = 文 || '—';
  return s;
}
async function 查() {
  const id = document.getElementById('事件号').value.trim();
  const 档情 = document.getElementById('档情');
  try {
    const d = await 投递台.getJSON('/api/事件/' + encodeURIComponent(id));
    document.getElementById('出').textContent = JSON.stringify(d, null, 2);
    档情.textContent = d.上限档
      ? ('本事件末次用档：' + d.上限档 + '；容忍上限 ' + d.容忍上限秒 + ' 秒；判定 ' + (d.判定 || ''))
      : '本事件暂无时钟验签票，默认按 40秒档。';

    const ct = document.getElementById('裁表'); ct.innerHTML = '';
    const 裁 = d.验签裁决 || await 投递台.getJSON('/api/验签?事件号=' + encodeURIComponent(id)).catch(() => []);
    for (const r of (裁 || [])) {
      const tr = 投递台.行(
        '<td>'+投递台.安全文本(r.裁决号)+'</td>'
        + '<td>'+投递台.安全文本(r.会话名)+'</td>'
        + '<td>'+投递台.安全文本(r.秒差)+'</td>'
        + '<td>'+投递台.安全文本(r.方向)+'</td>'
        + '<td>'+投递台.安全文本(r.容忍上限秒)+'</td>'
        + '<td>'+投递台.安全文本(r.上限档)+'</td>'
        + '<td class="判"></td>'
        + '<td>'+投递台.安全文本(r.验签状态)+'</td>'
        + '<td>'+投递台.安全文本(r.快照号)+'</td>'
        + '<td>'+投递台.安全文本(r.时刻)+'</td>'
      );
      tr.querySelector('.判').appendChild(钟徽章(r.判定));
      ct.appendChild(tr);
    }

    const tt = document.getElementById('试表'); tt.innerHTML = '';
    for (const r of (d.尝试 || [])) {
      const tr = 投递台.行(
        '<td>'+投递台.安全文本(r.尝试号)+'</td>'
        + '<td class="st"></td>'
        + '<td>'+投递台.安全文本(r.秒差 == null ? '' : r.秒差)+'</td>'
        + '<td>'+投递台.安全文本(r.上限档 || '')+'</td>'
        + '<td class="pd"></td>'
        + '<td>'+投递台.安全文本(r.拒因 || r.说明 || '')+'</td>'
        + '<td>'+投递台.安全文本(r.投递时)+'</td>'
      );
      tr.querySelector('.st').appendChild(投递台.徽章(r.状态));
      tr.querySelector('.pd').appendChild(钟徽章(r.判定));
      tt.appendChild(tr);
    }
  } catch (e) {
    document.getElementById('出').textContent = e.message;
    档情.textContent = '';
  }
}
document.getElementById('查').onclick = 查;
</script>

</body>
</html>
