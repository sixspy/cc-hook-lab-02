<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>投递流水 · 投递台</title>
  <link rel="stylesheet" href="/styles.css"/>
  <script src="/common.js"></script>
</head>
<body>
<header class="顶栏">
    <div class="牌">投递台</div>
    <nav>
      <a href="/">投递台</a>
      <a href="/端点名册.html">端点名册</a>
      <a href="/事件队列.html">事件队列</a>
      <a href="/投递流水.html" class="亮">投递流水</a>
      <a href="/死信匣.html">死信匣</a>
      <a href="/签名规.html">签名规</a>
      <a href="/投递互证.html">投递互证</a>
      <a href="/事件详情.html">事件详情</a>
    </nav>
    <button class="按钮 次" type="button" onclick="fetch('/api/登出',{method:'POST'}).then(()=>location.href='/login')">退出</button>
  </header>
  <main class="主区">
    <header class="页头">
      <h1>投递流水</h1>
      <p>Webhook 并发投递互斥（hook-02）· 同事件先占投递坑再写尝试，占坑与尝试同成同败 · 非工单客服</p>
    </header>

<section class="卷">
  <label>事件号</label><input id="事件号" placeholder="EVT-..."/>
  <label><input type="checkbox" id="强制失败"/> 强制失败（测死信）</label>
  <p class="消息" id="消息"></p>
  <button class="按钮" type="button" id="投递钮">签名投递一次</button>
  <button class="按钮 次" type="button" id="批量钮">批量重试待投</button>
</section>

<section class="卷">
  <h2>投递坑队列（按事件号占坑，拒绝重复回刷）</h2>
  <div class="表绕"><table><thead><tr><th>事件号</th><th>占坑态</th><th>轮次</th><th>尝试行数</th><th>尝试号</th><th>中文命运</th><th>占坑时</th></tr></thead><tbody id="坑表"></tbody></table></div>
</section>

<section class="卷">
  <h2>投递流水卡片（正式尝试集合）</h2>
  <div class="表绕"><table><thead><tr><th>尝试号</th><th>事件号</th><th>端点键</th><th>签名摘要</th><th>中文命运</th><th>响应码</th><th>说明</th></tr></thead><tbody id="表"></tbody></table></div>
</section>

  </main>

<script>
const 命运文案 = { '成功': '投递成功', '失败': '投递失败，待重试或入死信' };

async function 刷坑表() {
  const rows = await 投递台.getJSON('/api/投递锁');
  const tb = document.getElementById('坑表'); tb.innerHTML='';
  for (const r of rows) {
    const tr = 投递台.行('<td>'+投递台.安全文本(r.事件号)+'</td><td></td><td>'+投递台.安全文本(r.轮次)+'</td><td>'+投递台.安全文本(r.尝试行数 ?? 0)+'</td><td>'+投递台.安全文本(r.尝试号||'—')+'</td><td>'+投递台.安全文本(r.中文命运||'—')+'</td><td>'+投递台.安全文本(r.占坑时)+'</td>');
    tr.children[1].appendChild(投递台.徽章(r.占坑态)); tb.appendChild(tr);
  }
}
async function 刷表() {
  const rows = await 投递台.getJSON('/api/投递');
  const tb = document.getElementById('表'); tb.innerHTML='';
  for (const r of rows) {
    const tr = 投递台.行('<td>'+投递台.安全文本(r.尝试号)+'</td><td>'+投递台.安全文本(r.事件号)+'</td><td>'+投递台.安全文本(r.端点键)+'</td><td>'+投递台.安全文本(r.签名摘要)+'</td><td></td><td>'+投递台.安全文本(r.响应码)+'</td><td>'+投递台.安全文本(r.说明)+'</td>');
    const 命 = document.createElement('span');
    命.textContent = (r.状态 === '成功' ? '投递成功' : '投递失败');
    命.className = '徽章 ' + r.状态;
    tr.children[4].appendChild(命);
    tb.appendChild(tr);
  }
}
document.getElementById('投递钮').onclick = async () => {
  const 消息 = document.getElementById('消息');
  try {
    const rep = await 投递台.postJSON('/api/投递', {
      事件号: document.getElementById('事件号').value,
      强制失败: document.getElementById('强制失败').checked,
    });
    消息.textContent = JSON.stringify(rep);
    await 刷表(); await 刷坑表();
  } catch (e) { 消息.textContent = e.message; }
};
document.getElementById('批量钮').onclick = async () => {
  const rep = await 投递台.postJSON('/api/投递/批量重试', {});
  document.getElementById('消息').textContent = '批量 '+rep.条数;
  await 刷表(); await 刷坑表();
};
刷表(); 刷坑表();
</script>

</body>
</html>
